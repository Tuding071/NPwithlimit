name: NewPipe + Speed Limit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Latest stable NewPipe tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/TeamNewPipe/NewPipe/releases/latest --jq '.tag_name // empty' 2>/dev/null || true)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::warning::gh api failed, falling back to git ls-remote"
            TAG=$(git ls-remote --tags --refs https://github.com/TeamNewPipe/NewPipe.git 'refs/tags/v[0-9]*' \
                  | sed 's#.*/##' | grep -vE -- '-(rc|beta|alpha|pre)' | sort -V | tail -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine NewPipe tag"
            exit 1
          fi
          echo "Using NewPipe $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Clone NewPipe
        run: git clone --depth 1 --branch "$TAG" https://github.com/TeamNewPipe/NewPipe.git newpipe

      - name: Pick JDK
        id: jdk
        run: |
          V=17
          if grep -rqsE 'JVM_21|VERSION_21|jvmToolchain\(21\)|JavaLanguageVersion\.of\(21\)' newpipe --include='*.gradle' --include='*.kts' --include='*.toml'; then V=21; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.v }}

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.TAG }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject speed limiter
        run: |
          D=newpipe/app/src/main/java/us/shandian/giga/get
          mkdir -p "$D"

          # --- SpeedLimiter: shared throttle clock across all threads ---
          cat > "$D/SpeedLimiter.kt" <<'EOF'
          package us.shandian.giga.get

          import android.content.Context
          import android.os.SystemClock
          import java.io.File

          object SpeedLimiter {
              private const val FILE_NAME = "speed_limit_kbps.txt"
              private const val REFRESH_MS = 1000L

              private val lock = Any()
              @Volatile private var limitBps = 0L
              @Volatile private var lastRead = 0L
              @Volatile private var appCtx: Context? = null
              private var nextFreeNs = 0L

              private fun filesDir(): File? = appCtx?.filesDir

              private fun readKbps(f: File): Long = try {
                  if (f.exists()) f.readText().trim().toLongOrNull() ?: 0L else 0L
              } catch (e: Exception) {
                  0L
              }

              private fun applyBps(v: Long) {
                  if (v != limitBps) {
                      limitBps = v
                      synchronized(lock) { nextFreeNs = 0L }
                  }
              }

              private fun currentLimit(): Long {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastRead >= REFRESH_MS) {
                      lastRead = now
                      val dir = filesDir()
                      if (dir != null) {
                          val kbps = readKbps(File(dir, FILE_NAME))
                          applyBps(if (kbps > 0) kbps * 1024L else 0L)
                      }
                  }
                  return limitBps
              }

              @JvmStatic
              fun getKbps(ctx: Context): Long {
                  appCtx = ctx.applicationContext ?: ctx
                  return readKbps(File(ctx.filesDir, FILE_NAME))
              }

              @JvmStatic
              fun setKbps(ctx: Context, kbps: Long) {
                  appCtx = ctx.applicationContext ?: ctx
                  val f = File(ctx.filesDir, FILE_NAME)
                  try {
                      if (kbps > 0) f.writeText(kbps.toString()) else f.delete()
                  } catch (e: Exception) {
                  }
                  applyBps(if (kbps > 0) kbps * 1024L else 0L)
                  lastRead = SystemClock.elapsedRealtime()
              }

              @JvmStatic
              fun pass(bytes: Int): Int {
                  if (bytes > 0) throttle(bytes.toLong())
                  return bytes
              }

              @JvmStatic
              fun pass(bytes: Long): Long {
                  if (bytes > 0) throttle(bytes)
                  return bytes
              }

              private fun throttle(bytes: Long) {
                  val limit = currentLimit()
                  if (limit <= 0) return
                  val waitUntil = synchronized(lock) {
                      val now = System.nanoTime()
                      val start = if (nextFreeNs - now > 0) nextFreeNs else now
                      nextFreeNs = start + bytes * 1_000_000_000L / limit
                      nextFreeNs
                  }
                  while (true) {
                      val remaining = waitUntil - System.nanoTime()
                      if (remaining <= 0) return
                      if (currentLimit() <= 0) return
                      try {
                          Thread.sleep(minOf(remaining / 1_000_000L, 100L).coerceAtLeast(1L))
                      } catch (e: InterruptedException) {
                          Thread.currentThread().interrupt()
                          return
                      }
                  }
              }
          }
          EOF

          # --- ThrottlingInputStream: wrap any InputStream, throttle on read ---
          cat > "$D/ThrottlingInputStream.kt" <<'EOF'
          package us.shandian.giga.get

          import java.io.FilterInputStream
          import java.io.InputStream

          class ThrottlingInputStream(inner: InputStream) : FilterInputStream(inner) {
              override fun read(): Int {
                  val b = super.read()
                  if (b >= 0) SpeedLimiter.pass(1)
                  return b
              }

              override fun read(b: ByteArray, off: Int, len: Int): Int {
                  val n = super.read(b, off, len)
                  if (n > 0) SpeedLimiter.pass(n)
                  return n
              }

              override fun skip(n: Long): Long {
                  val s = super.skip(n)
                  if (s > 0) SpeedLimiter.pass(s.toInt())
                  return s
              }
          }
          EOF

          # --- Wire the wrapper into the two download runnables ---
          python3 - <<'PY'
          import re, pathlib, sys

          src = pathlib.Path("newpipe/app/src")

          def files(name):
              return [p for p in src.rglob("*")
                      if p.is_file() and p.name in (name + ".java", name + ".kt")]

          patched = 0
          for name in ("DownloadRunnable", "DownloadRunnableFallback"):
              for p in files(name):
                  t = p.read_text()
                  orig = t

                  if p.suffix == ".java":
                      # Match `InputStream is = ...;` / `InputStream mIs = ...;`
                      # but only when NOT already wrapped.
                      pat = re.compile(
                          r"(\b(?:final\s+)?InputStream\s+(\w+)\s*=\s*)([^;]*?)(\s*;)"
                      )
                      def repl(m):
                          if "ThrottlingInputStream" in m.group(3):
                              return m.group(0)
                          return (m.group(1)
                                  + "new us.shandian.giga.get.ThrottlingInputStream("
                                  + m.group(3).strip() + ")"
                                  + m.group(4))
                      t, n = pat.subn(repl, t)
                  else:
                      pat = re.compile(
                          r"(\b(?:val|var)\s+(\w+)\s*:\s*InputStream\s*=\s*)([^\n]*?)(\s*$)",
                          re.M,
                      )
                      def repl(m):
                          if "ThrottlingInputStream" in m.group(3):
                              return m.group(0)
                          return (m.group(1)
                                  + "us.shandian.giga.get.ThrottlingInputStream("
                                  + m.group(3).strip() + ")"
                                  + m.group(4))
                      t, n = pat.subn(repl, t)

                  if n and t != orig:
                      p.write_text(t)
                      print("wrapped InputStream in %s: %d site(s)" % (p.name, n))
                      patched += n

          if patched == 0:
              print("::error::Could not find InputStream assignments. Dumping context:")
              for name in ("DownloadRunnable", "DownloadRunnableFallback"):
                  for p in files(name):
                      for i, line in enumerate(p.read_text().splitlines(), 1):
                          if "InputStream" in line or ".read(" in line:
                              print("%s:%d: %s" % (p.name, i, line.strip()))
              sys.exit(1)

          man = src / "main" / "AndroidManifest.xml"
          x = man.read_text()
          if "SpeedLimitActivity" not in x:
              assert "</application>" in x, "no </application> in manifest"
              act = """
              <activity
                  android:name="us.shandian.giga.get.SpeedLimitActivity"
                  android:exported="true"
                  android:label="NewPipe DL Limit"
                  android:launchMode="singleTask"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          """
              x = x.replace("</application>", act + "    </application>", 1)
              man.write_text(x)
              print("manifest patched")
          PY

          echo "--- verify injection ---"
          grep -rn "ThrottlingInputStream" newpipe/app/src/main/java/us/shandian/giga/get/DownloadRunnable*.java 2>/dev/null || true
          grep -rn "ThrottlingInputStream" newpipe/app/src/main/java/us/shandian/giga/get/DownloadRunnable*.kt 2>/dev/null || true

      - name: Build
        working-directory: newpipe
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show build error (if failed)
        if: failure()
        run: |
          echo "=== First failure marker ==="
          grep -n -m1 -A40 -E "FAILURE: Build failed|^e: |error: " newpipe/build.log || tail -n 120 newpipe/build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir out
          for f in $(find newpipe/app/build/outputs/apk -name '*.apk'); do
            cp "$f" "out/NewPipe-${TAG}-speedlimit-$(basename "$f")"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewPipe-${{ env.TAG }}-speedlimit
          path: out/*.apk

      - name: Publish release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view newpipe-speedlimit --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload newpipe-speedlimit out/*.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit newpipe-speedlimit --repo "$GITHUB_REPOSITORY" \
              --title "NewPipe $TAG + speed limit" \
              --notes "Built from upstream $TAG"
          else
            gh release create newpipe-speedlimit out/*.apk --repo "$GITHUB_REPOSITORY" \
              --title "NewPipe $TAG + speed limit" --notes "Built from upstream $TAG"
          fi
